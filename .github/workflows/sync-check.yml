name: sync-check

on:
  schedule:
    - cron: "0 2 * * *" # 每日 UTC 02:00
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步引擎——比对 HEAD、刷新原样件、记录变化
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_daily.py

      - name: 提交同步产物（HEAD 快照 / 刷新的原样件 / 同步日志）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "无变化，跳过提交" || {
            git commit -m "chore(sync): 每日上游同步 $(date -u +%F) — 刷新原样件与 HEAD 快照"
            for i in 1 2 3 4 5; do git push && break; echo "推送重试 $i/5"; sleep 5; done
          }

      - name: 重译工单——有翻译件变更时开/更新 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/sync-pending-retranslation.md ]; then
            gh label create translation --color 0E8A16 --force 2>/dev/null || true
            existing=$(gh issue list --state open --label translation --json number,title \
              --jq '.[] | select(.title | startswith("上游同步待重译")) | .number' | head -1)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file data/sync-pending-retranslation.md
            else
              gh issue create \
                --title "上游同步待重译（$(date -u +%F)）" \
                --body-file data/sync-pending-retranslation.md \
                --label translation || echo "::warning::issue 创建失败，清单已提交在 data/sync-pending-retranslation.md"
            fi
          else
            echo "无待重译文件"
          fi
